name: Clojure CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Install Leiningen
      run: sudo apt-get install -y leiningen
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein test
